<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Minimarket Fast Food</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Style */
        nav {
            background-color: #121212;
            border-bottom: 1px solid #222222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-logo span {
            color: #888888;
            font-size: 12px;
            font-weight: 400;
            margin-left: 5px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        /* Navigasi Dinamis */
        .buyer-menu, .seller-menu {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-logout {
            background: none;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Main Content */
        .container {
            flex: 1;
            padding: 40px 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #222222;
            padding-bottom: 15px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-title p {
            font-size: 14px;
            color: #888888;
            margin-top: 5px;
        }

        /* Grid Produk */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #444444;
        }

        .product-img-wrapper {
            width: 100%;
            height: 180px;
            background-color: #1a1a1a;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ffffff;
            color: #000000;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-seller {
            font-size: 11px;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #ffffff;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-top: auto;
            margin-bottom: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
        }

        .btn-buy {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-buy:hover {
            background-color: #cccccc;
        }

        .btn-delete {
            background-color: #2c1515;
            color: #ff8888;
            border-color: #ff3333;
        }

        .btn-delete:hover {
            background-color: #ff3333;
            color: #ffffff;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #666666;
            font-size: 15px;
            border: 1px dashed #222222;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">FastFood Outlet <span id="userGreeting"></span></div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            
            <div id="buyerMenu" class="buyer-menu" style="display: none;">
                <a href="cart.html">Keranjang</a>
                <a href="riwayat.html">Riwayat Belanja</a>
                <a href="account.html">Akun</a>
            </div>

            <div id="sellerMenu" class="seller-menu" style="display: none;">
                <a href="add.html">Tambah Produk</a>
                <a href="riwayat.html">Riwayat Toko</a>
            </div>

            <button class="btn-logout" id="btnLogout">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <div class="header-title">
                <h1 id="dashboardTitle">Menu Makanan & Minuman</h1>
                <p id="dashboardDesc">Sajian cepat saji berkualitas, langsung siap diantar.</p>
            </div>
        </div>

        <div class="products-grid" id="productsContainer">
            </div>
    </div>

    <script>
        // Cek sesi login user
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!currentUser) {
            window.location.href = 'login.html';
        }

        const userGreeting = document.getElementById('userGreeting');
        const buyerMenu = document.getElementById('buyerMenu');
        const sellerMenu = document.getElementById('sellerMenu');
        const dashboardTitle = document.getElementById('dashboardTitle');
        const dashboardDesc = document.getElementById('dashboardDesc');
        const productsContainer = document.getElementById('productsContainer');
        const btnLogout = document.getElementById('btnLogout');

        // Set nama dan role di navbar
        userGreeting.innerText = `(${currentUser.name} - ${currentUser.role.toUpperCase()})`;

        // Sesuaikan menu berdasarkan role
        if (currentUser.role === 'penjual') {
            sellerMenu.style.display = 'flex';
            dashboardTitle.innerText = "Etalase Toko Anda";
            dashboardDesc.innerText = "Kelola semua produk makanan cepat saji yang Anda pasarkan di sini.";
        } else {
            buyerMenu.style.display = 'flex';
        }

        // Fungsi me-render produk dari LocalStorage
        function tampilkanProduk() {
            const daftarProduk = JSON.parse(localStorage.getItem('products')) || [];
            productsContainer.innerHTML = "";

            if (daftarProduk.length === 0) {
                productsContainer.innerHTML = `<div class="empty-message">Belum ada produk cepat saji yang tersedia saat ini.</div>`;
                return;
            }

            daftarProduk.forEach((product) => {
                // Format rupiah manual
                const formattedPrice = "Rp " + parseInt(product.price).toLocaleString('id-ID');

                const card = document.createElement('div');
                card.className = 'product-card';

                // Tentukan tombol aksi berdasarkan role user saat ini
                let actionButton = "";
                if (currentUser.role === 'penjual') {
                    // Penjual hanya bisa menghapus produk miliknya sendiri
                    if (product.sellerUsername === currentUser.username) {
                        actionButton = `<button class="btn-action btn-delete" onclick="hapusProduk('${product.id}')">Hapus Produk</button>`;
                    } else {
                        actionButton = `<button class="btn-action" style="border-color:#333; color:#555;" disabled>Produk Toko Lain</button>`;
                    }
                } else {
                    // Pembeli diarahkan ke halaman detail produk bawa ID-nya di URL
                    actionButton = `<a href="product.html?id=${product.id}" class="btn-action btn-buy">Lihat Detail</a>`;
                }

                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <span class="product-badge">${product.category}</span>
                        <img src="${product.imageLink}" class="product-img" alt="${product.name}" onerror="this.src='https://placehold.co/400x300/1a1a1a/ffffff?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <div class="product-seller">Penjual: ${product.sellerName}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${formattedPrice}</div>
                        ${actionButton}
                    </div>
                `;
                productsContainer.appendChild(card);
            });
        }

        // Fungsi khusus penjual untuk menghapus barang
        window.hapusProduk = function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus makanan/minuman ini dari etalase?")) {
                let daftarProduk = JSON.parse(localStorage.getItem('products')) || [];
                daftarProduk = daftarProduk.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(daftarProduk));
                tampilkanProduk(); // reload etalase
            }
        }

        // Logika Tombol Logout
        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        // Jalankan fungsi tampilkan data saat halaman dibuka
        tampilkanProduk();
    </script>
</body>
</html>
